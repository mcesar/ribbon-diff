[package]
name = "ribbon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
libc = "0.2.191"
ratatui = "0.30.2"
similar = "3.2.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-onig"] }
tiny-skia = "0.12.0"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-onig"] }
unicode-width = "0.2.3"
